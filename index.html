<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CardWorld</title><link rel="stylesheet" href="/style.css"></head><body><main id="app"><section id="gate" class="gate"><h1>CardWorld</h1><p>输入卡密进入世界</p><div class="gate-row"><input id="code" placeholder="卡密" autocomplete="off"><button onclick="enter()">进入</button></div><div id="err"></div></section><section id="world" hidden><header><div><b id="title">世界</b><small id="meta">—</small></div></header><article id="story"></article><section id="plus" class="panel" hidden><button onclick="contacts()">通讯录</button><button onclick="worldbook()">世界书</button><button onclick="settings()">设置</button><button onclick="voice()">♫ 语音</button></section><div id="emoji" class="emoji" hidden>😀 😃 😄 😁 😂 🥹 😊 😎 😍 🤔 😮 😴 😭 😡 ❤️ ✨ 🔥</div><footer><button class="icon" onclick="emoji()">🙂</button><div class="inputbox"><input id="msg" placeholder="输入你想说的话……" oninput="sendState()"><button id="send" onclick="send()">↑</button></div><button class="icon" onclick="togglePlus()">＋</button></footer></section></main><script src="/app.js"></script></body></html>
