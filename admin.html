<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardWorld Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="padding:24px;max-width:900px;margin:auto"><h1>管理后台</h1><section class="panel" style="position:static;box-shadow:none;margin:20px 0"><button onclick="gen('1h')">生成1h</button><button onclick="gen('5h')">生成5h</button><button onclick="gen('12h')">生成12h</button><button onclick="gen('1d')">生成1d</button><button onclick="gen('7d')">生成7d</button><button onclick="gen('15d')">生成15d</button><button onclick="gen('30d')">生成30d</button><button onclick="cards()">卡密列表</button><button onclick="worlds()">世界列表</button><button onclick="seeds()">种子库</button><button onclick="renew()">续期</button><button onclick="freeze()">冻结</button><button onclick="setpass()">设置管理员密码</button></section><pre id="out" style="white-space:pre-wrap;background:#fff;border-radius:18px;padding:18px"></pre></main><script>const token=localStorage.adminToken;async function api(p,o={}){o.headers={'content-type':'application/json',authorization:'Bearer '+token};let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function gen(type){let d=await api('/api/admin/cards',{method:'POST',body:JSON.stringify({type,count:10})});out.textContent=JSON.stringify(d,null,2)}async function cards(){out.textContent=JSON.stringify(await api('/api/admin/cards'),null,2)}async function worlds(){out.textContent=JSON.stringify(await api('/api/admin/worlds'),null,2)}async function seeds(){out.textContent=JSON.stringify(await api('/api/admin/seeds'),null,2)}async function renew(){let c=prompt('卡密');if(c)out.textContent=JSON.stringify(await api('/api/admin/renew',{method:'POST',body:JSON.stringify({code:c})}),null,2)}async function freeze(){let c=prompt('卡密');if(c)out.textContent=JSON.stringify(await api('/api/admin/freeze',{method:'POST',body:JSON.stringify({code:c})}),null,2)}async function setpass(){let p=prompt('新管理员密码（至少8位）');if(p)out.textContent=JSON.stringify(await api('/api/admin/password',{method:'POST',body:JSON.stringify({password:p})}),null,2)}</script></body></html>
